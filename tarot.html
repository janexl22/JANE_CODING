      height: 100%;

    }

      height: 100%;
      display: block;

      top: 0;
      left: 0;

    }
    .ritual-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      display: flex;
      align-items: center;
      gap: 10px;
    }

      content: '';
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #a855f7;
      border-radius: 50%;
      box-shadow: 0 0 8px #9333ea;
    }

      text-shadow: 0 0 10px rgba(106, 27, 154, 0.6);
      transition: color 0.5s ease;
      margin-bottom: 8px;
    }

      position: absolute;

      left: 40px;
      width: 280px;
      background: rgba(11, 7, 18, 0.82);
      border: 1px solid rgba(147, 51, 234, 0.3);

      pointer-events: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.85), 0 0 15px rgba(106, 27, 154, 0.15);
    }
    .tutorial-title {
      font-size: 11px;
      letter-spacing: 0.2em;
      color: #c084fc;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(147, 51, 234, 0.2);
      padding-bottom: 6px;
    }
    .tutorial-step {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 11px;
      line-height: 1.5;
      color: rgba(216, 196, 240, 0.6);
      letter-spacing: 0.05em;
      transition: all 0.3s;
    }
    .tutorial-step.active {
      color: #f3e8ff;
      text-shadow: 0 0 8px rgba(192, 132, 252, 0.6);
    }
    .tutorial-icon {
      font-size: 14px;
      line-height: 1;
    }

    /* 右上角 320x240 Live Camera Feed */
    .camera-container {
      position: absolute;
      top: 24px;
      right: 24px;
      width: 240px;
      height: 180px;
      background: rgba(8, 5, 13, 0.88);
      border: 1px solid rgba(147, 51, 234, 0.35);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.9), 0 0 15px rgba(88, 28, 135, 0.3);
      border-radius: 4px;
      overflow: hidden;
      z-index: 20;
      backdrop-filter: blur(8px);
      pointer-events: auto;
    }
    .camera-container video {
      display: none;
    }
    .camera-container canvas {
      width: 100%;
      height: 100%;

      display: block;
    }
    .camera-meta {
      position: absolute;

      left: 8px;

      { id: "major-20", num: "XX", name: "JUDGEMENT", desc: "审判 · 命运召唤与彻底复活", bg: "#ebf5fb", fg: "#5b2c6f", sub: "大天使号角·破棺苏醒", symbol: "📯", figure: "🎺" },
      { id: "major-21", num: "XXI", name: "THE WORLD", desc: "世界 · 万象归一与圆满终章", bg: "#eafaf1", fg: "#1e8449", sub: "椭圆月桂冠·宇宙舞者", symbol: "🌿", figure: "💃" }

    const SUITS = [
      { key: "WANDS", name: "WANDS", zh: "权杖", color: "#b34224", icon: "🪄", element: "火 ELEMENT OF FIRE" },
      { key: "CUPS", name: "CUPS", zh: "圣杯", color: "#2980b9", icon: "🏆", element: "水 ELEMENT OF WATER" },
      { key: "SWORDS", name: "SWORDS", zh: "宝剑", color: "#475463", icon: "⚔", element: "风 ELEMENT OF AIR" },
      { key: "PENTACLES", name: "PENTACLES", zh: "星币", color: "#d4ac0d", icon: "🪙", element: "土 ELEMENT OF EARTH" }
    ];

    const RANKS = [
      { name: "ACE", num: "A", zh: "王牌", count: 1, title: "根源灵感" },
      { name: "TWO", num: "2", zh: "二", count: 2, title: "两极平衡" },
      { name: "THREE", num: "3", zh: "三", count: 3, title: "初步显化" },
      { name: "FOUR", num: "4", zh: "四", count: 4, title: "稳固秩序" },
      { name: "FIVE", num: "5", zh: "五", count: 5, title: "突破冲突" },
      { name: "SIX", num: "6", zh: "六", count: 6, title: "分享胜利" },
      { name: "SEVEN", num: "7", zh: "七", count: 7, title: "坚守抉择" },
      { name: "EIGHT", num: "8", zh: "八", count: 8, title: "快速前行" },
      { name: "NINE", num: "9", zh: "九", count: 9, title: "圆融守护" },
      { name: "TEN", num: "10", zh: "十", count: 10, title: "阶段完成" },
      { name: "PAGE", num: "PAGE", zh: "侍从", count: 1, title: "纯真探索" },
      { name: "KNIGHT", num: "KNIGHT", zh: "骑士", count: 1, title: "勇往直前" },
      { name: "QUEEN", num: "QUEEN", zh: "王后", count: 1, title: "包容滋养" },
      { name: "KING", num: "KING", zh: "国王", count: 1, title: "成熟统御" }
    ];

    // 78 张 Rider–Waite–Smith 公版牌图。图片来源为公开的完整 RWS 牌组；
    // 每张牌都使用独立 JPG 纹理，不再在 Canvas 中用 emoji / symbol 拼画正面。
    const RWS_IMAGE_BASE = "https://raw.githubusercontent.com/seven102161/elaine-tarot-cards/main/cards/";
    const MINOR_IMAGE_CODES = {
      ACE: "ac", TWO: "02", THREE: "03", FOUR: "04", FIVE: "05",
      SIX: "06", SEVEN: "07", EIGHT: "08", NINE: "09", TEN: "10",
      PAGE: "pa", KNIGHT: "kn", QUEEN: "qu", KING: "ki"
    };
    const SUIT_IMAGE_CODES = { WANDS: "wa", CUPS: "cu", SWORDS: "sw", PENTACLES: "pe" };

    function buildFull78Deck() {
      const deck = [];
      let idx = 0;

      // 22 Major
      MAJOR_ARCANA_DATA.forEach(m => {
        deck.push({
          uniqueId: idx++,
          id: m.id,
          number: m.num,
          name: m.name,
          desc: m.desc,
          sub: m.sub,
          arcana: "major",
          suit: null,
          rank: null,
          themeColor: m.fg,
          bgColor: m.bg,
          symbol: m.symbol,
          figure: m.figure || "✨"
          ,frontTexture: `${RWS_IMAGE_BASE}ar${String(idx - 1).padStart(2, "0")}.jpg`
        });
      });

      // 56 Minor
      SUITS.forEach(suit => {
        RANKS.forEach(rank => {
          deck.push({
            uniqueId: idx++,
            id: `${suit.key.toLowerCase()}-${rank.num.toLowerCase()}`,
            number: rank.num,
            name: `${rank.name} OF ${suit.name}`,
            desc: `${suit.zh}${rank.zh} · ${rank.title}`,
            sub: suit.element,
            arcana: "minor",
            suit: suit.name,
            rank: rank.name,
            themeColor: suit.color,
            bgColor: "#faf6ec",
            suitIcon: suit.icon,
            count: rank.count
            ,frontTexture: `${RWS_IMAGE_BASE}${SUIT_IMAGE_CODES[suit.key]}${MINOR_IMAGE_CODES[rank.name]}.jpg`
          });
        });
      });

      return deck;
    }

    const FULL_78_DECK = buildFull78Deck();

    // =========================================================================
    // 2. 状态机与尺寸配置
    // =========================================================================
    const STATES = {
      IDLE: 'IDLE',
      SHUFFLING: 'SHUFFLING',
      ORGANIZING: 'ORGANIZING',
      SELECTING: 'SELECTING',
      HOVERING: 'HOVERING',
      SELECTED: 'SELECTED',
      REVEALING: 'REVEALING',
      REVEALED: 'REVEALED'
    };

    const CONFIG = {
      cardCount: 78,
      cardWidth: 1.45,
      cardHeight: 2.55,
      cardDepth: 0.02,
      colors: {
        bgBlackPurple: 0x050307,
        deepViolet: 0x140624,
        mysticViolet: 0x6b21a8,
        lightViolet: 0xc084fc,
      },
      particles: {
        ambientCount: 1100,
        trailCount: 500,
      }
    };

    // 纯正黑紫流动卡背 Shader
    const CardBackShader = {
      uniforms: {
        uTime: { value: 0 },
        uHover: { value: 0 },
        uDim: { value: 0.0 },
        uPurpleGlow: { value: new THREE.Color(0xa855f7) },
        uDarkViolet: { value: new THREE.Color(0x0e041a) }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        uniform float uHover;
        uniform float uDim;
        uniform vec3 uPurpleGlow;
        uniform vec3 uDarkViolet;
        varying vec2 vUv;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
        float snoise(vec2 v) {
          const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
          vec2 i  = floor(v + dot(v, C.yy) );
          vec2 x0 = v -   i + dot(i, C.xx);
          vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
          vec4 x12 = x0.xyxy + C.xxzz;
          x12.xy -= i1;
          i = mod289(i);
          vec3 p = permute( permute( i.y + vec3(0.0, i1.y, 1.0 )) + i.x + vec3(0.0, i1.x, 1.0 ));
          vec3 m = max(0.5 - vec3(dot(x0,x0), dot(x12.xy,x12.xy), dot(x12.zw,x12.zw)), 0.0);
          m = m*m ; m = m*m ;
          vec3 x = 2.0 * fract(p * C.www) - 1.0;
          vec3 h = abs(x) - 0.5;
          vec3 ox = floor(x + 0.5);
          vec3 a0 = x - ox;
          m *= 1.79284291400159 - 0.85373472095314 * ( a0*a0 + h*h );
          vec3 g;
          g.x  = a0.x  * x0.x  + h.x  * x0.y;
          g.yz = a0.yz * x12.xz + h.yz * x12.yw;
          return 130.0 * dot(m, g);
        }

        void main() {
          vec2 uv = vUv;
          float borderDistX = min(uv.x, 1.0 - uv.x);
          float borderDistY = min(uv.y, 1.0 - uv.y);
          float border = min(borderDistX, borderDistY);
          float isBorder = smoothstep(0.035, 0.025, border);
          float isInnerLine = smoothstep(0.055, 0.05, border) - smoothstep(0.05, 0.045, border);

          float flow = snoise(uv * 3.5 + vec2(0.0, uTime * 0.12));
          float detailNoise = snoise(uv * 16.0 - vec2(uTime * 0.04));
          
          vec3 basePattern = mix(uDarkViolet, vec3(0.02, 0.005, 0.04), flow * 0.5 + 0.5);
          basePattern += vec3(0.08, 0.02, 0.14) * detailNoise * 0.4;

          vec2 centerUv = uv - vec2(0.5);
          float r = length(centerUv);
          float occultRings = sin(r * 40.0 - uTime * 0.7) * 0.5 + 0.5;
          float ringMask = smoothstep(0.38, 0.05, r);
          basePattern += uPurpleGlow * occultRings * ringMask * 0.3;

          vec3 violetEdge = mix(uPurpleGlow * 0.5, uPurpleGlow * 1.2, uv.y + flow * 0.2);
          vec3 finalColor = mix(basePattern, violetEdge, max(isBorder, isInnerLine));
          
          finalColor += uPurpleGlow * uHover * 0.75 * (1.0 - border);
          finalColor = mix(finalColor, vec3(0.005, 0.002, 0.01), uDim);

          gl_FragColor = vec4(finalColor, 1.0 - uDim * 0.85);
        }
      `
    };

    // =========================================================================
    // 3. 伟特塔罗图片纹理加载器
    // =========================================================================
    function createTextureNotice(title, subtitle) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 880;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = "#f3ead2";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#1a1208";
      ctx.lineWidth = 8;
      ctx.strokeRect(16, 16, canvas.width - 32, canvas.height - 32);
      ctx.fillStyle = "#1a1208";
      ctx.font = 'bold 30px Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(title, canvas.width / 2, 410);
      ctx.font = '18px Arial, sans-serif';
      ctx.fillText(subtitle, canvas.width / 2, 455);

      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.needsUpdate = true;
      return texture;
    }

    // =========================================================================
    // 4. 主程序组件
    // =========================================================================
    function TarotApp() {
      const mountRef = useRef(null);
      const videoRef = useRef(null);
      const camCanvasRef = useRef(null);

      const [appState, setAppState] = useState(STATES.IDLE);
      const [hoverProgress, setHoverProgress] = useState(0);
      const [handDetected, setHandDetected] = useState(false);
      const [currentGestureName, setCurrentGestureName] = useState("NONE");
      const [revealedCard, setRevealedCard] = useState(null);

      const core = useRef({
        scene: null,
        camera: null,
        renderer: null,
        cards: [],
        particles: null,
        trailParticles: null,
        energyRing: null,
        state: STATES.IDLE,
        rawGesture: 'NONE',
        gestureDuration: {
          OPEN: 0,
          FIST: 0,
          POINT: 0
        },
        stateLockTimer: 0,
        organizingTimer: 0,
        hand: {
          x: 0,
          y: 0,
          prevX: 0,
          prevY: 0,
          vx: 0,
          vy: 0,
          speed: 0,
          worldPos: new THREE.Vector3(),
          indexFingerTipWorld: new THREE.Vector3(),
          detected: false
        },
        hoveredCardIndex: -1,
        hoverTimer: 0,
        selectedCard: null
      });

      useEffect(() => {
        const currentMount = mountRef.current;
        const width = currentMount.clientWidth;
        const height = currentMount.clientHeight;

        // 1. 初始化 WebGL
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(CONFIG.colors.bgBlackPurple, 0.035);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 100);
        camera.position.set(0, 0, 15);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.25;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        currentMount.appendChild(renderer.domElement);

        core.current.scene = scene;
        core.current.camera = camera;
        core.current.renderer = renderer;

        // 2. 空间灯光系统
        const ambientLight = new THREE.AmbientLight(0x4a1e75, 1.2);
        scene.add(ambientLight);

        const violetSpot = new THREE.SpotLight(0xa855f7, 4.5, 35, Math.PI / 3.5, 0.6, 1);
        violetSpot.position.set(0, 8, 9);
        scene.add(violetSpot);

        const frontKeyLight = new THREE.DirectionalLight(0xfff8ee, 1.6);
        frontKeyLight.position.set(0, 2, 10);
        scene.add(frontKeyLight);

        // 3. 构建 78 张卡牌：正面绑定伟特图案 + 背面黑紫 Shader
        const cardGeometry = new THREE.BoxGeometry(CONFIG.cardWidth, CONFIG.cardHeight, CONFIG.cardDepth);
        const cardMaterialSide = new THREE.MeshStandardMaterial({
          color: 0x11071c,
          metalness: 0.85,
          roughness: 0.3
        });

        const cards = [];
        const textureLoader = new THREE.TextureLoader();
        textureLoader.setCrossOrigin('anonymous');
        const loadingTexture = createTextureNotice('RWS TAROT', 'Loading original card artwork…');
        FULL_78_DECK.forEach((cardData, i) => {
          const frontMaterial = new THREE.MeshBasicMaterial({
            map: loadingTexture,
            toneMapped: false,
            transparent: false,
            color: 0xffffff
          });

          textureLoader.load(
            cardData.frontTexture,
            (frontTexture) => {
              frontTexture.colorSpace = THREE.SRGBColorSpace;
              frontTexture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
              frontTexture.minFilter = THREE.LinearMipmapLinearFilter;
              frontTexture.magFilter = THREE.LinearFilter;
              frontMaterial.map = frontTexture;
              frontMaterial.needsUpdate = true;
              cardData.textureLoaded = true;
            },
            undefined,
            () => {
              frontMaterial.map = createTextureNotice(cardData.name, 'Card image could not be loaded');
              frontMaterial.needsUpdate = true;
              cardData.textureLoadError = true;
              console.error(`RWS image failed to load: ${cardData.frontTexture}`);
            }
          );

          const backShaderMaterial = new THREE.ShaderMaterial({
            uniforms: THREE.UniformsUtils.clone(CardBackShader.uniforms),
            vertexShader: CardBackShader.vertexShader,
            fragmentShader: CardBackShader.fragmentShader,
            transparent: true
          });

          const materials = [
            cardMaterialSide,
            cardMaterialSide,
            cardMaterialSide,
            cardMaterialSide,
            frontMaterial,       // 正面：真实伟特原版图案
            backShaderMaterial   // 背面：黑紫 Shader
          ];

          const mesh = new THREE.Mesh(cardGeometry, materials);
          mesh.castShadow = true;
          mesh.receiveShadow = true;

          const cardObj = {
            id: i,
            cardData: cardData,
            mesh: mesh,
            x: (Math.random() - 0.5) * 0.4,
            y: (Math.random() - 0.5) * 0.4,
            z: i * 0.008,
            vx: (Math.random() - 0.5) * 0.02,
            vy: (Math.random() - 0.5) * 0.02,
            vz: 0,
            rotZ: (Math.random() - 0.5) * 0.1,
            vRotZ: (Math.random() - 0.5) * 0.01,
            rotX: 0,
            rotY: Math.PI, // 初始背面朝上
            targetRotY: Math.PI,
            targetRotX: 0,
            isHovered: false,
            scale: 1,
            targetScale: 1,
            damping: 0.94,
            targetX: 0,
            targetY: 0,
            targetZ: 0,
            dimValue: 0.0
          };

          mesh.position.set(cardObj.x, cardObj.y, cardObj.z);
          mesh.rotation.y = Math.PI;
          scene.add(mesh);
          cards.push(cardObj);
        });
        core.current.cards = cards;

        // 4. GPU 黑紫环境粒子系统
        const particleGeo = new THREE.BufferGeometry();
        const pCount = CONFIG.particles.ambientCount;
        const pPositions = new Float32Array(pCount * 3);
        const pScales = new Float32Array(pCount);
        const pVelocities = new Float32Array(pCount * 3);

        for (let i = 0; i < pCount; i++) {
          pPositions[i * 3] = (Math.random() - 0.5) * 34;
          pPositions[i * 3 + 1] = (Math.random() - 0.5) * 22;
          pPositions[i * 3 + 2] = (Math.random() - 0.5) * 16 - 2;
          pScales[i] = Math.random() * 0.04 + 0.01;
          pVelocities[i * 3] = (Math.random() - 0.5) * 0.004;
          pVelocities[i * 3 + 1] = (Math.random() - 0.5) * 0.004 + 0.002;
          pVelocities[i * 3 + 2] = (Math.random() - 0.5) * 0.004;
        }

        particleGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        particleGeo.setAttribute('scale', new THREE.BufferAttribute(pScales, 1));

        const particleMat = new THREE.PointsMaterial({
          color: 0xa855f7,
          size: 0.08,
          transparent: true,
          opacity: 0.65,
          blending: THREE.AdditiveBlending
        });

        const ambientParticlesMesh = new THREE.Points(particleGeo, particleMat);
        scene.add(ambientParticlesMesh);
        core.current.particles = { mesh: ambientParticlesMesh, pos: pPositions, vel: pVelocities };

        // 5. 手势交互粒子尾迹
        const trailGeo = new THREE.BufferGeometry();
        const trailCount = CONFIG.particles.trailCount;
        const trailPositions = new Float32Array(trailCount * 3);
        const trailLifes = new Float32Array(trailCount);
        const trailVels = new Float32Array(trailCount * 3);

        for (let i = 0; i < trailCount; i++) {
          trailLifes[i] = 0.0;
        }
        trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositions, 3));
        const trailMat = new THREE.PointsMaterial({
          color: 0xc084fc,
          size: 0.12,
          transparent: true,
          opacity: 0.8,
          blending: THREE.AdditiveBlending
        });
        const trailMesh = new THREE.Points(trailGeo, trailMat);
        scene.add(trailMesh);
        core.current.trailParticles = { mesh: trailMesh, pos: trailPositions, life: trailLifes, vels: trailVels };

        // 6. 紫色 5 秒选择能量环
        const ringGeo = new THREE.RingGeometry(1.4, 1.55, 64);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0xc084fc,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0,
          blending: THREE.AdditiveBlending
        });
        const energyRing = new THREE.Mesh(ringGeo, ringMat);
        energyRing.visible = false;
        scene.add(energyRing);
        core.current.energyRing = energyRing;

        // 7. MediaPipe Hands 追踪集成
        let hands = null;
        let cameraStream = null;

        if (window.Hands) {
          hands = new window.Hands({
            locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`,
          });

          hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.65,
            minTrackingConfidence: 0.65,
          });

          hands.onResults((results) => {
            const ctx = camCanvasRef.current?.getContext('2d');
            if (ctx && camCanvasRef.current) {
              ctx.clearRect(0, 0, camCanvasRef.current.width, camCanvasRef.current.height);
              if (results.image) {
                ctx.drawImage(results.image, 0, 0, camCanvasRef.current.width, camCanvasRef.current.height);
              }
            }

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
              setHandDetected(true);
              const landmarks = results.multiHandLandmarks[0];

              if (ctx) {
                drawHandSkeleton(ctx, landmarks, camCanvasRef.current.width, camCanvasRef.current.height);
              }

              interpretStrictGesture(landmarks);
            } else {
              setHandDetected(false);
              core.current.rawGesture = 'NONE';
              setCurrentGestureName('NONE');
            }
          });

          if (videoRef.current) {
            cameraStream = new window.Camera(videoRef.current, {
              onFrame: async () => {
                if (videoRef.current && hands) {
                  await hands.send({ image: videoRef.current });
                }
              },
              width: 320,
              height: 240,
            });
            cameraStream.start().catch((err) => {
              console.warn("Camera fallback active:", err);
            });
          }
        }

        function drawHandSkeleton(ctx, landmarks, w, h) {
          ctx.strokeStyle = '#a855f7';
          ctx.lineWidth = 2;
          ctx.fillStyle = '#c084fc';

          const connections = [
            [0,1],[1,2],[2,3],[3,4],
            [0,5],[5,6],[6,7],[7,8],
            [0,9],[9,10],[10,11],[11,12],
            [0,13],[13,14],[14,15],[15,16],
            [0,17],[17,18],[18,19],[19,20]
          ];

          connections.forEach(([i, j]) => {
            ctx.beginPath();
            ctx.moveTo(landmarks[i].x * w, landmarks[i].y * h);
            ctx.lineTo(landmarks[j].x * w, landmarks[j].y * h);
            ctx.stroke();
          });

          landmarks.forEach((lm) => {
            ctx.beginPath();
            ctx.arc(lm.x * w, lm.y * h, 3, 0, Math.PI * 2);
            ctx.fill();
          });
        }

        function interpretStrictGesture(landmarks) {
          const wrist = landmarks[0];
          const palmCenter = landmarks[9];
          const thumbTip = landmarks[4];
          const indexTip = landmarks[8];
          const middleTip = landmarks[12];
          const ringTip = landmarks[16];
          const pinkyTip = landmarks[20];

          const dist = (p1, p2) => Math.hypot(p1.x - p2.x, p1.y - p2.y);

          const indexExt = dist(indexTip, wrist);
          const middleExt = dist(middleTip, wrist);
          const ringExt = dist(ringTip, wrist);
          const pinkyExt = dist(pinkyTip, wrist);

          const indexToPalm = dist(indexTip, palmCenter);
          const middleToPalm = dist(middleTip, palmCenter);
          const ringToPalm = dist(ringTip, palmCenter);
          const pinkyToPalm = dist(pinkyTip, palmCenter);

          const avgDistToPalm = (indexToPalm + middleToPalm + ringToPalm + pinkyToPalm) / 4;
          const avgExt = (indexExt + middleExt + ringExt + pinkyExt) / 4;
          const otherExt = (middleExt + ringExt + pinkyExt) / 3;

          let detected = 'UNKNOWN';

          if (avgDistToPalm < 0.19 && avgExt < 0.29 && indexToPalm < 0.22 && middleToPalm < 0.22) {
            detected = 'FIST';
          } else if (indexExt > 0.35 && otherExt < 0.26 && (indexExt - otherExt > 0.14)) {
            detected = 'POINT';
          } else if (avgExt > 0.40 && avgDistToPalm > 0.26) {
            detected = 'OPEN';
          }

          core.current.rawGesture = detected;
          setCurrentGestureName(detected);

          const rawPalmX = (landmarks[9].x + landmarks[0].x) / 2;
          const rawPalmY = (landmarks[9].y + landmarks[0].y) / 2;

          const normPalmX = (1.0 - rawPalmX) * 2 - 1;
          const normPalmY = -(rawPalmY * 2 - 1);

          const normIndexX = (1.0 - indexTip.x) * 2 - 1;
          const normIndexY = -(indexTip.y * 2 - 1);

          updateHandCoordinates(normPalmX, normPalmY, normIndexX, normIndexY);
        }

        function updateHandCoordinates(normX, normY, indexNormX, indexNormY) {
          const h = core.current.hand;
          const alpha = 0.35;

          h.prevX = h.x;
          h.prevY = h.y;
          h.x = h.x + (normX - h.x) * alpha;
          h.y = h.y + (normY - h.y) * alpha;

          h.vx = h.x - h.prevX;
          h.vy = h.y - h.prevY;
          h.speed = Math.sqrt(h.vx * h.vx + h.vy * h.vy);
          h.detected = true;

          h.worldPos.set(h.x * 8.5, h.y * 5.0, 0);
          h.indexFingerTipWorld.set(indexNormX * 8.5, indexNormY * 5.0, 0);

          if (h.speed > 0.004) {
            spawnTrailParticles(h.worldPos.x, h.worldPos.y, h.vx, h.vy);
          }
        }

        function spawnTrailParticles(x, y, vx, vy) {
          const tp = core.current.trailParticles;
          for (let k = 0; k < 2; k++) {
            const idx = Math.floor(Math.random() * CONFIG.particles.trailCount);
            tp.pos[idx * 3] = x + (Math.random() - 0.5) * 0.3;
            tp.pos[idx * 3 + 1] = y + (Math.random() - 0.5) * 0.3;
            tp.pos[idx * 3 + 2] = (Math.random() - 0.5) * 0.4;
            tp.vels[idx * 3] = vx * 0.4 + (Math.random() - 0.5) * 0.02;
            tp.vels[idx * 3 + 1] = vy * 0.4 + (Math.random() - 0.5) * 0.02;
            tp.vels[idx * 3 + 2] = (Math.random() - 0.5) * 0.02;
            tp.life[idx] = 1.0;
          }
          tp.mesh.geometry.attributes.position.needsUpdate = true;
        }

        // 鼠标降级支持
        let isMouseDown = false;
        const handleMouseDown = () => { isMouseDown = true; };
        const handleMouseUp = () => { isMouseDown = false; };
        const handleMouseMove = (e) => {
          if (core.current.hand.detected && handDetected) return;

          const normX = (e.clientX / window.innerWidth) * 2 - 1;
          const normY = -(e.clientY / window.innerHeight) * 2 + 1;

          if (isMouseDown) {
            core.current.rawGesture = 'OPEN';
          } else {
            core.current.rawGesture = 'POINT';
          }
          setCurrentGestureName(core.current.rawGesture);
          updateHandCoordinates(normX, normY, normX, normY);
        };
        const handleDblClick = () => {
          if (core.current.state === STATES.SHUFFLING) {
            core.current.rawGesture = 'FIST';
          }
        };

        window.addEventListener('mousedown', handleMouseDown);
        window.addEventListener('mouseup', handleMouseUp);
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('dblclick', handleDblClick);

        const handleResize = () => {
          const w = currentMount.clientWidth;
          const h = currentMount.clientHeight;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener('resize', handleResize);

        // =========================================================================
        // 5. 渲染与物理模拟主循环
        // =========================================================================
        let clock = new THREE.Clock();
        let animationFrameId;

        const animate = () => {
          animationFrameId = requestAnimationFrame(animate);
          const dt = Math.min(clock.getDelta(), 0.1);
          const elapsedTime = clock.getElapsedTime();

          const c = core.current;
          const hand = c.hand;

          if (c.stateLockTimer > 0) {
            c.stateLockTimer -= dt;
          }

          const raw = c.rawGesture;
          c.gestureDuration.OPEN = raw === 'OPEN' ? c.gestureDuration.OPEN + dt : 0;
          c.gestureDuration.FIST = raw === 'FIST' ? c.gestureDuration.FIST + dt : 0;
          c.gestureDuration.POINT = raw === 'POINT' ? c.gestureDuration.POINT + dt : 0;

          // 状态机管理
          if (c.stateLockTimer <= 0) {
            if (c.state === STATES.IDLE) {
              if (c.gestureDuration.OPEN >= 0.25) {
                c.state = STATES.SHUFFLING;
                setAppState(STATES.SHUFFLING);
                c.stateLockTimer = 0.3;

                cards.forEach((card, idx) => {
                  const angle = (idx / 78) * Math.PI * 2 + Math.random() * 0.5;
                  const speed = 0.08 + Math.random() * 0.12;
                  card.vx += Math.cos(angle) * speed;
                  card.vy += Math.sin(angle) * speed;
                });
              }
            } 
            else if (c.state === STATES.SHUFFLING) {
              if (c.gestureDuration.FIST >= 0.4) {
                c.state = STATES.ORGANIZING;
                setAppState(STATES.ORGANIZING);
                c.stateLockTimer = 1.6;
                c.organizingTimer = 0;
              }
            } 
            else if (c.state === STATES.ORGANIZING) {
              c.organizingTimer += dt;
              if (c.organizingTimer >= 1.4) {
                c.state = STATES.SELECTING;
                setAppState(STATES.SELECTING);
              }
            } 
            else if (c.state === STATES.SELECTING || c.state === STATES.HOVERING) {
              if (c.gestureDuration.OPEN >= 0.6 && hand.speed > 0.04) {
                c.state = STATES.SHUFFLING;
                setAppState(STATES.SHUFFLING);
                c.stateLockTimer = 0.5;
                c.hoverTimer = 0;
                c.hoveredCardIndex = -1;
                if (c.energyRing) c.energyRing.visible = false;
                setRevealedCard(null);
              }
            } 
            else if (c.state === STATES.REVEALED) {
              if (c.gestureDuration.OPEN >= 0.5) {
                cards.forEach(card => {
                  card.targetRotY = Math.PI;
                  card.targetRotX = 0;
                  card.dimValue = 0.0;
                });
                c.state = STATES.SHUFFLING;
                setAppState(STATES.SHUFFLING);
                c.stateLockTimer = 0.6;
                setRevealedCard(null);
              }
            }
          }

          // 物理模拟：大面积分散 Wash Shuffle 与从左到右自然排列
          const handRadius = 3.2;
          const sortedCardsByRealPos = [...cards].sort((a, b) => a.x - b.x);

          cards.forEach((card, idx) => {
            if (card.mesh.material[5].uniforms) {
              card.mesh.material[5].uniforms.uTime.value = elapsedTime;
            }

            if (c.state === STATES.SHUFFLING) {
              const dx = card.x - hand.worldPos.x;
              const dy = card.y - hand.worldPos.y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < handRadius) {
                const forceFactor = (1.0 - dist / handRadius);
                card.vx += (hand.vx * 35.0 * forceFactor) + (Math.random() - 0.5) * 0.06;
                card.vy += (hand.vy * 35.0 * forceFactor) + (Math.random() - 0.5) * 0.06;
                card.vRotZ += (hand.vx * -10.0 + (Math.random() - 0.5) * 0.3) * forceFactor;
              }

              const boundX = 6.8;
              const boundY = 3.8;
              if (card.x > boundX) card.vx -= (card.x - boundX) * 0.05;
              if (card.x < -boundX) card.vx -= (card.x + boundX) * 0.05;
              if (card.y > boundY) card.vy -= (card.y - boundY) * 0.05;
              if (card.y < -boundY) card.vy -= (card.y + boundY) * 0.05;

              for (let j = idx + 1; j < Math.min(idx + 8, cards.length); j++) {
                const other = cards[j];
                const cdx = other.x - card.x;
                const cdy = other.y - card.y;
                const cdist = Math.sqrt(cdx * cdx + cdy * cdy);
                const minDist = 0.85;
                if (cdist < minDist && cdist > 0.001) {
                  const overlap = (minDist - cdist) * 0.5;
                  const nx = cdx / cdist;
                  const ny = cdy / cdist;
                  card.vx -= nx * overlap * 0.22;
                  card.vy -= ny * overlap * 0.22;
                  other.vx += nx * overlap * 0.22;
                  other.vy += ny * overlap * 0.22;
                }
              }

              card.vx *= card.damping;
              card.vy *= card.damping;
              card.vRotZ *= 0.88;

              card.x += card.vx;
              card.y += card.vy;
              card.rotZ += card.vRotZ;
              card.z = THREE.MathUtils.lerp(card.z, (idx - 39) * 0.008, 0.1);
              card.targetRotY = Math.PI;
              card.targetRotX = 0;
              card.targetScale = 1.0;
              card.dimValue = 0.0;

            } else if (c.state === STATES.ORGANIZING || c.state === STATES.SELECTING || c.state === STATES.HOVERING) {
              const spreadIndex = sortedCardsByRealPos.indexOf(card);
              const totalSpan = 14.8;
              const stepX = totalSpan / (CONFIG.cardCount - 1);

              card.targetX = -totalSpan / 2 + spreadIndex * stepX;
              card.targetY = 0.0;
              card.targetZ = spreadIndex * 0.012;
              card.targetRotY = Math.PI;
              card.targetRotX = 0;
              card.targetScale = 1.0;
              card.dimValue = 0.0;

              const delayFactor = spreadIndex / CONFIG.cardCount;
              const lerpSpeed = Math.max(0.035, Math.min(0.12, 0.11 - delayFactor * 0.04));

              card.x = THREE.MathUtils.lerp(card.x, card.targetX, lerpSpeed);
              card.y = THREE.MathUtils.lerp(card.y, card.targetY, lerpSpeed);
              card.z = THREE.MathUtils.lerp(card.z, card.targetZ, 0.08);
              card.rotZ = THREE.MathUtils.lerp(card.rotZ, 0, 0.1);
              card.rotX = THREE.MathUtils.lerp(card.rotX, 0, 0.1);
            }

            // 单食指选牌跟随与高亮
            if (c.state === STATES.SELECTING || c.state === STATES.HOVERING) {
              const tipPos = hand.indexFingerTipWorld;
              let closestCard = null;
              let minXDist = 999;
              
              cards.forEach(cItem => {
                const dist = Math.abs(cItem.x - tipPos.x);
                if (dist < minXDist) {
                  minXDist = dist;
                  closestCard = cItem;
                }
              });

              if (closestCard && minXDist < 0.65 && (c.gestureDuration.POINT > 0.08 || !handDetected)) {
                c.hoveredCardIndex = closestCard.id;
              }

              if (c.hoveredCardIndex === card.id) {
                card.isHovered = true;
                card.targetY = 0.95;
                card.targetZ += 0.55;
                card.targetScale = 1.15;
              } else {
                card.isHovered = false;
                if (c.hoveredCardIndex !== -1) {
                  const hCard = cards.find(item => item.id === c.hoveredCardIndex);
                  if (hCard) {
                    const diffX = card.x - hCard.x;
                    if (Math.abs(diffX) < 1.2 && Math.abs(diffX) > 0.01) {
                      card.targetX += Math.sign(diffX) * 0.12;
                    }
                  }
                }
              }
            }

            if (card.mesh.material[5].uniforms) {
              const currentHoverU = card.mesh.material[5].uniforms.uHover.value;
              card.mesh.material[5].uniforms.uHover.value = THREE.MathUtils.lerp(
                currentHoverU,
                card.isHovered ? 1.0 : 0.0,
                0.2
              );
            }

            // 翻牌至真实正面：旋转至 Y=0 展现真实 RWS 正面图案
            if (c.state === STATES.REVEALING || c.state === STATES.REVEALED) {
              if (card === c.selectedCard) {
                card.targetX = 0;
                card.targetY = 0.35;
                card.targetZ = 7.6;
                card.targetRotY = 0; // 真实旋转 180 度到 0 度，正面对准摄像机
                card.targetScale = 2.45; // 放大至屏幕高度 55%~60%
                card.dimValue = 0.0;

                if (c.state === STATES.REVEALED) {
                  card.targetY = 0.35 + Math.sin(elapsedTime * 2.2) * 0.06;
                  card.rotZ = Math.sin(elapsedTime * 1.4) * 0.015;
                }
              } else {
                const dir = card.id < c.selectedCard.id ? -1 : 1;
                const offset = Math.abs(card.id - c.selectedCard.id);
                card.targetX = (card.id < c.selectedCard.id ? -8.5 : 8.5) + dir * (offset * 0.05);
                card.targetY = -2.6;
                card.targetZ = -5.0;
                card.targetScale = 0.55;
                card.dimValue = 0.9;
              }

              card.x = THREE.MathUtils.lerp(card.x, card.targetX, 0.06);
              card.y = THREE.MathUtils.lerp(card.y, card.targetY, 0.06);
              card.z = THREE.MathUtils.lerp(card.z, card.targetZ, 0.06);
              card.rotZ = THREE.MathUtils.lerp(card.rotZ, 0, 0.08);
            }

            card.scale = THREE.MathUtils.lerp(card.scale, card.targetScale, 0.12);
            card.rotY = THREE.MathUtils.lerp(card.rotY, card.targetRotY, 0.08);
            card.rotX = THREE.MathUtils.lerp(card.rotX, card.targetRotX, 0.08);

            if (card.mesh.material[5].uniforms) {
              card.mesh.material[5].uniforms.uDim.value = THREE.MathUtils.lerp(
                card.mesh.material[5].uniforms.uDim.value,
                card.dimValue,
                0.08
              );
            }

            card.mesh.position.set(card.x, card.y, card.z);
            card.mesh.rotation.set(card.rotX, card.rotY, card.rotZ);
            card.mesh.scale.setScalar(card.scale);
          });

          // 5 秒停留选择确认
          if (c.state === STATES.SELECTING || c.state === STATES.HOVERING) {
            if (c.hoveredCardIndex !== -1 && hand.speed < 0.018) {
              c.state = STATES.HOVERING;
              setAppState(STATES.HOVERING);
              c.hoverTimer += dt;
              const progress = Math.min(c.hoverTimer / 5.0, 1.0);
              setHoverProgress(progress);

              const hCard = cards.find(item => item.id === c.hoveredCardIndex);
              if (hCard && c.energyRing) {
                c.energyRing.visible = true;
                c.energyRing.position.set(hCard.x, hCard.y, hCard.z + 0.1);
                c.energyRing.rotation.z = elapsedTime * 1.5;
                c.energyRing.material.opacity = progress * 0.95;
                const ringScale = 0.7 + progress * 0.35;
                c.energyRing.scale.set(ringScale, ringScale, 1.0);
              }

              if (c.hoverTimer >= 5.0) {
                c.state = STATES.REVEALING;
                setAppState(STATES.REVEALING);
                c.selectedCard = hCard;
                setRevealedCard(hCard.cardData);
                if (c.energyRing) c.energyRing.visible = false;

                spawnBurstParticles(hCard.x, hCard.y);

                setTimeout(() => {
                  c.state = STATES.REVEALED;
                  setAppState(STATES.REVEALED);
                }, 1200);
              }
            } else {
              c.hoverTimer = 0;
              setHoverProgress(0);
              if (c.energyRing) c.energyRing.visible = false;
              if (c.state === STATES.HOVERING) {
                c.state = STATES.SELECTING;
                setAppState(STATES.SELECTING);
              }
            }
          }

          function spawnBurstParticles(x, y) {
            const tp = c.trailParticles;
            for (let i = 0; i < CONFIG.particles.trailCount; i++) {
              tp.pos[i * 3] = x;
              tp.pos[i * 3 + 1] = y;
              tp.pos[i * 3 + 2] = 2.0;
              const angle = Math.random() * Math.PI * 2;
              const force = Math.random() * 0.22 + 0.08;
              tp.vels[i * 3] = Math.cos(angle) * force;
              tp.vels[i * 3 + 1] = Math.sin(angle) * force;
              tp.vels[i * 3 + 2] = (Math.random() - 0.5) * 0.15;
              tp.life[i] = 1.0;
            }
          }

          // 粒子系统模拟
          const ap = c.particles;
          for (let i = 0; i < CONFIG.particles.ambientCount; i++) {
            ap.pos[i * 3 + 1] += ap.vel[i * 3 + 1];
            ap.pos[i * 3] += Math.sin(elapsedTime + i) * 0.002;
            if (ap.pos[i * 3 + 1] > 11) ap.pos[i * 3 + 1] = -11;
          }
          ap.mesh.geometry.attributes.position.needsUpdate = true;

          const tp = c.trailParticles;
          for (let i = 0; i < CONFIG.particles.trailCount; i++) {
            if (tp.life[i] > 0) {
              tp.pos[i * 3] += tp.vels[i * 3];
              tp.pos[i * 3 + 1] += tp.vels[i * 3 + 1];
              tp.pos[i * 3 + 2] += tp.vels[i * 3 + 2];
              tp.life[i] -= dt * 1.5;
              if (tp.life[i] < 0) tp.life[i] = 0;
            }
          }
          tp.mesh.geometry.attributes.position.needsUpdate = true;

          renderer.render(scene, camera);
        };

        animate();

        return () => {
          cancelAnimationFrame(animationFrameId);
          window.removeEventListener('mousedown', handleMouseDown);
          window.removeEventListener('mouseup', handleMouseUp);
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('dblclick', handleDblClick);
          window.removeEventListener('resize', handleResize);
          if (cameraStream) cameraStream.stop();
          renderer.dispose();
          if (currentMount) currentMount.innerHTML = '';
        };
      }, []);

      const getGuidanceText = () => {
        switch (appState) {
          case STATES.IDLE:
            return "张开五指（或按住鼠标拖拽）· 开启 78 张全量牌组洗牌";
          case STATES.SHUFFLING:
            return "在桌面肆意拨动揉散 78 张牌 · 完整握拳（或双击）结束洗牌";
          case STATES.ORGANIZING:
            return "78 张塔罗牌从左向右依次凝聚排列中...";
          case STATES.SELECTING:
            return "左右移动食指 · 指针实时定位所指塔罗牌";
          case STATES.HOVERING:
            return `食指保持指向 · 紫色灵力聚集中 (${(hoverProgress * 5).toFixed(1)}s / 5.0s)`;
          case STATES.REVEALING:
          case STATES.REVEALED:
            return "张开五指可重新洗牌";
          default:
            return "";
        }
      };

      return React.createElement(
        'div',
        { style: { width: '100%', height: '100%', position: 'relative' } },
        React.createElement('div', { ref: mountRef, style: { width: '100%', height: '100%' } }),
        React.createElement('div', { className: 'film-grain' }),

        // 左侧手势与步骤教程面板
        React.createElement(
          'div',
          { className: 'tutorial-panel' },
          React.createElement(
            'div',
            { className: 'tutorial-title' },
            React.createElement('span', null, "78 伟特塔罗仪式指引"),
            React.createElement('span', { style: { fontSize: '9px', opacity: 0.8 } }, "1909 RWS DECK")
          ),
          React.createElement(
            'div',
            { className: `tutorial-step ${appState === STATES.IDLE || appState === STATES.SHUFFLING ? 'active' : ''}` },
            React.createElement('span', { className: 'tutorial-icon' }, "🖐️"),
            React.createElement('div', null, React.createElement('strong', null, "1. 五指张开"), "：进入大面积散牌洗牌，手掌实时推散 78 张牌海")
          ),
          React.createElement(
            'div',
            { className: `tutorial-step ${appState === STATES.ORGANIZING ? 'active' : ''}` },
            React.createElement('span', { className: 'tutorial-icon' }, "✊"),
            React.createElement('div', null, React.createElement('strong', null, "2. 完整握拳"), "：结束洗牌，78 张牌从左至右自然流畅排列")
          ),
          React.createElement(
            'div',
            { className: `tutorial-step ${appState === STATES.SELECTING || appState === STATES.HOVERING ? 'active' : ''}` },
            React.createElement('span', { className: 'tutorial-icon' }, "☝️"),
            React.createElement('div', null, React.createElement('strong', null, "3. 单食指指针"), "：左右移动食指实时寻牌，静止 5 秒锁定抽出")
          ),
          React.createElement(
            'div',
            { className: `tutorial-step ${appState === STATES.REVEALED ? 'active' : ''}` },
            React.createElement('span', { className: 'tutorial-icon' }, "✨"),
            React.createElement('div', null, React.createElement('strong', null, "4. 重新洗牌"), "：翻牌后张开五指即可重置")
          )
        ),

        // 顶部 HUD
        React.createElement(
          'div',
          { className: 'ritual-overlay' },
          React.createElement(
            'div',
            { style: { display: 'flex', justifyContent: 'center', width: '100%' } },
            React.createElement('div', { className: 'status-badge' }, `RITUAL STATE: ${appState}`)
          ),
          React.createElement(
            'div',
            { className: 'instructions-hint' },
            getGuidanceText()
          ),
          React.createElement('div', null)
        ),

        // 翻牌成功结果展示
        revealedCard && React.createElement(
          'div',
          { 
            className: 'card-title-panel',
            style: { 
              opacity: appState === STATES.REVEALED ? 1 : 0,
              transform: appState === STATES.REVEALED ? 'translateX(-50%) translateY(0)' : 'translateX(-50%) translateY(20px)'
            }
          },
          React.createElement('div', { className: 'card-title-num' }, revealedCard.number),
          React.createElement('div', { className: 'card-title-name' }, revealedCard.name),
          React.createElement('div', { className: 'card-title-desc' }, revealedCard.desc)
        ),

        // 右上角 Live Tracking Feed
        React.createElement(
          'div',
          { className: 'camera-container' },
          React.createElement('video', { ref: videoRef, playsInline: true, muted: true }),
          React.createElement('canvas', { ref: camCanvasRef, width: 320, height: 240 }),
          React.createElement(
            'div',
            { className: 'camera-meta' },
            React.createElement('span', null, handDetected ? `GESTURE: ${currentGestureName}` : "MOUSE FALLBACK"),
            React.createElement('span', null, "78 RWS · 60 FPS")
          )
        )
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(TarotApp));
  </script>
</body>
</html>
